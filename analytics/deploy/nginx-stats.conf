server {
    # HAProxy terminates no TLS: it passes the encrypted stream and original
    # client address (PROXY v1) to this loopback-only TLS listener.
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name stats.relay.intersignal.org;
    ssl_certificate /etc/letsencrypt/live/stats.relay.intersignal.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.relay.intersignal.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    access_log off;
    client_max_body_size 4k;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
